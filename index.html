<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bubu &amp; Dudu Day (with Lani)</title>
<style>
  :root {
    --cream: #fff8f0;
    --blush: #ffd6e0;
    --ink: #3d2b1f;
    --soft: #8b6f5c;
    --outline: #3d2b1f;
    --dudu: #c69c7c;
    --dudu-blush: #ffd166;
    --bubu: #ffffff;
    --bubu-blush: #ffadad;
    --tongue: #ff70a6;
    --pastel: #fde2e4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #ffe8f0 0%, #fff5e6 40%, #e8f4ff 100%);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100%;
    padding: 12px 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  header { text-align: center; padding: 8px 4px 4px; }
  header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #e87a9a, #7ab8e8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub { font-size: 0.82rem; color: var(--soft); margin-top: 2px; }

  .stage-wrap {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(92, 64, 51, 0.15);
    background: var(--pastel);
    aspect-ratio: 4 / 3.2;
    min-height: 280px;
  }

  .stage {
    width: 100%;
    height: 100%;
    position: relative;
    transition: background 0.9s ease;
  }

  .stage.idle {
    background: linear-gradient(180deg, #fde2e4 0%, #ffe8f0 45%, #fff0f5 100%);
  }
  .stage.cafe {
    background: linear-gradient(180deg, #ffe8d0 0%, #f5d0a8 55%, #e8c090 100%);
  }
  .stage.adventure {
    background: linear-gradient(180deg, #a8d4f0 0%, #c8e8d8 45%, #e8d8a8 100%);
  }
  .stage.bedroom {
    background: linear-gradient(180deg, #1a1228 0%, #3a2850 50%, #2a1a38 100%);
  }

  .scene-title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.88);
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    white-space: nowrap;
  }
  .scene-title.show { opacity: 1; }
  .stage.bedroom .scene-title {
    background: rgba(80, 50, 90, 0.85);
    color: #ffe8f0;
  }

  .decor { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  /* ---- Cafe decor ---- */
  .table {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 72%;
    height: 16%;
    background: #c48a5a;
    border-radius: 8px 8px 4px 4px;
    box-shadow: 0 4px 0 #9a6a40;
    z-index: 2;
  }
  .table::before {
    content: "";
    position: absolute;
    top: -8px; left: 5%; right: 5%;
    height: 10px;
    background: #d4a070;
    border-radius: 6px;
  }
  .cup {
    position: absolute;
    width: 20px; height: 24px;
    background: #fff;
    border-radius: 0 0 8px 8px;
    border: 2px solid #e8d8c8;
    bottom: 100%;
    margin-bottom: 4px;
  }
  .cup::after {
    content: "";
    position: absolute;
    right: -7px; top: 4px;
    width: 7px; height: 9px;
    border: 2px solid #e8d8c8;
    border-left: none;
    border-radius: 0 8px 8px 0;
  }
  .steam-wisp {
    position: absolute;
    bottom: calc(100% + 28px);
    width: 4px; height: 18px;
    pointer-events: none;
  }
  .steam-wisp span {
    position: absolute;
    left: 50%;
    width: 8px; height: 8px;
    border: 2px solid rgba(255,255,255,0.55);
    border-radius: 50% 50% 50% 0;
    border-left-color: transparent;
    border-bottom-color: transparent;
    animation: steamRise 2s ease-in-out infinite;
    opacity: 0;
  }
  .steam-wisp span:nth-child(1) { animation-delay: 0s; margin-left: -6px; }
  .steam-wisp span:nth-child(2) { animation-delay: 0.6s; margin-left: 2px; }
  .steam-wisp span:nth-child(3) { animation-delay: 1.2s; margin-left: -2px; }

  .croissant-prop {
    position: absolute;
    width: 30px; height: 18px;
    bottom: 100%;
    margin-bottom: 6px;
    z-index: 3;
  }
  .croissant-prop svg { width: 100%; height: 100%; display: block; }
  .croissant-prop.nibbling {
    animation: croNibble 0.7s ease-in-out infinite;
  }
  .crumb {
    position: absolute;
    width: 4px; height: 4px;
    background: #e8a860;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  .crumb.show { animation: crumbFall 1.2s ease-out forwards; }
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    background: #ffe8a0;
    border-radius: 50%;
    box-shadow: 0 0 6px #ffe8a0;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  .sparkle.show { animation: sparklePop 1s ease-out forwards; }

  /* ---- Adventure decor ---- */
  .map {
    position: absolute;
    top: 14%;
    right: 6%;
    width: 74px; height: 56px;
    background: #f5e8c8;
    border: 2.5px solid #c8a870;
    border-radius: 4px;
    box-shadow: 2px 3px 0 rgba(0,0,0,0.08);
    transform-origin: center top;
    animation: mapFlutter 3s ease-in-out infinite;
  }
  .map::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1.5px dashed #a08050;
    border-radius: 2px;
  }
  .map .pin {
    position: absolute;
    width: 9px; height: 9px;
    background: #e05070;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    top: 38%; left: 44%;
    animation: pinBounce 1.5s ease-in-out infinite;
  }
  .suitcase {
    position: absolute;
    bottom: 10%;
    right: 10%;
    width: 50px; height: 38px;
    background: #6a9ad0;
    border-radius: 6px;
    border: 2.5px solid #4a7ab0;
    animation: suitcaseBounce 0.9s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .suitcase::before {
    content: "";
    position: absolute;
    top: -9px; left: 13px;
    width: 20px; height: 9px;
    border: 2.5px solid #4a7ab0;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .suitcase::after {
    content: "";
    position: absolute;
    top: 42%; left: 0; right: 0;
    height: 2.5px;
    background: #4a7ab0;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    animation: cloudDrift 12s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud.c1 { width: 44px; height: 18px; top: 10%; left: -20%; animation-duration: 18s; }
  .cloud.c1::before { width: 22px; height: 22px; top: -10px; left: 6px; }
  .cloud.c1::after { width: 16px; height: 16px; top: -6px; right: 8px; }
  .cloud.c2 { width: 56px; height: 20px; top: 6%; left: -30%; animation-duration: 22s; animation-delay: -6s; }
  .cloud.c2::before { width: 26px; height: 26px; top: -12px; left: 10px; }
  .cloud.c2::after { width: 18px; height: 18px; top: -8px; right: 10px; }
  .cloud.c3 { width: 36px; height: 14px; top: 18%; left: -15%; animation-duration: 16s; animation-delay: -10s; }
  .cloud.c3::before { width: 18px; height: 18px; top: -8px; left: 4px; }
  .cloud.c3::after { width: 14px; height: 14px; top: -5px; right: 6px; }

  /* ---- Bedroom decor ---- */
  .curtains {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .curtain-panel {
    position: absolute;
    top: 0; bottom: 0;
    width: 18%;
    background: linear-gradient(90deg, #5a3060, #7a4878);
    box-shadow: inset -8px 0 12px rgba(0,0,0,0.2);
    transition: transform 1.2s ease;
  }
  .curtain-panel.left { left: 0; transform-origin: left center; }
  .curtain-panel.right { right: 0; transform-origin: right center; }
  .stage.bedroom.curtains-drawn .curtain-panel.left { transform: scaleX(1.35); }
  .stage.bedroom.curtains-drawn .curtain-panel.right { transform: scaleX(1.35); }
  .bed {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 78%;
    height: 30%;
    background: #6a4068;
    border-radius: 12px 12px 6px 6px;
    z-index: 2;
  }
  .bed::before {
    content: "";
    position: absolute;
    top: -16%;
    left: 5%; right: 5%;
    height: 38%;
    background: #f8e8f0;
    border-radius: 8px;
  }
  .bed::after {
    content: "";
    position: absolute;
    top: -8%;
    left: 12%;
    width: 28%;
    height: 22%;
    background: #e8d0e8;
    border-radius: 6px;
    box-shadow: 40px 0 0 #e8d0e8;
  }
  .heart-float {
    position: absolute;
    font-size: 14px;
    opacity: 0;
    animation: heartRise 2.5s ease-out forwards;
    pointer-events: none;
    z-index: 20;
  }
  .heart-burst {
    position: absolute;
    left: 50%; top: 45%;
    width: 0; height: 0;
    z-index: 22;
    pointer-events: none;
  }
  .heart-burst span {
    position: absolute;
    font-size: 16px;
    opacity: 0;
  }
  .heart-burst.go span { animation: burstOut 1.1s ease-out forwards; }
  .dim-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 8, 25, 0.4);
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
    z-index: 4;
  }
  .dim-overlay.on { opacity: 1; }
  .lamp-glow {
    position: absolute;
    top: 8%;
    left: 50%;
    width: 80px; height: 80px;
    margin-left: -40px;
    background: radial-gradient(circle, rgba(255,200,160,0.35), transparent 70%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 1.2s;
    z-index: 3;
    pointer-events: none;
  }
  .stage.bedroom .lamp-glow { opacity: 0.7; }
  .stage.bedroom.dimmed .lamp-glow { opacity: 0.25; }

  /* ---- Characters (SVG wrappers) ---- */
  .char {
    position: absolute;
    bottom: 20%;
    width: 88px;
    height: 110px;
    z-index: 10;
    transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1), bottom 0.5s ease;
    will-change: transform, left, bottom;
  }
  .char.dudu { left: 16%; }
  .char.bubu { left: 48%; }
  .char.leader { z-index: 12; }
  .char svg.bear {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* Idle: gentle bob + sway */
  .char.idle-anim .bear-root {
    animation: idleBob 2.4s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  .char.bubu.idle-anim .bear-root { animation-delay: 0.3s; }
  .char.idle-anim .leg-l,
  .char.idle-anim .leg-r {
    transform-origin: 50% 20%;
  }
  .char.idle-anim .leg-l { animation: waddleL 1.2s ease-in-out infinite; }
  .char.idle-anim .leg-r { animation: waddleR 1.2s ease-in-out infinite; }
  .char.idle-anim .arm-outer {
    transform-origin: 50% 15%;
    animation: armSway 2.4s ease-in-out infinite;
  }

  /* Holding hands bridge */
  .hands-bridge {
    position: absolute;
    bottom: 38%;
    left: 38%;
    width: 24px; height: 10px;
    z-index: 11;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .hands-bridge.show { opacity: 1; }
  .hands-bridge svg { width: 100%; height: 100%; }

  /* Blink */
  .eye-dot { transform-origin: center; }
  .char.blink .eye-dot {
    animation: blinkEyes 0.18s ease-in-out;
  }

  /* Walking */
  .char.walking .bear-root {
    animation: walkBob 0.45s ease-in-out infinite;
  }
  .char.walking .leg-l { animation: walkLegL 0.45s ease-in-out infinite; transform-origin: 50% 15%; }
  .char.walking .leg-r { animation: walkLegR 0.45s ease-in-out infinite; transform-origin: 50% 15%; }
  .char.walking .arm-outer { animation: walkArm 0.45s ease-in-out infinite; transform-origin: 50% 15%; }

  /* Sitting */
  .char.sitting { bottom: 30%; }
  .char.sitting .leg-l,
  .char.sitting .leg-r {
    animation: none !important;
    transform: scaleY(0.55) translateY(4px);
  }
  .char.sitting .bear-root {
    animation: sitSway 3s ease-in-out infinite;
  }

  /* Eating / sipping */
  .char.eating .head-grp {
    animation: nibbleHead 0.55s ease-in-out infinite;
    transform-origin: 50% 80%;
  }
  .char.sipping .arm-held {
    animation: sipArm 1.4s ease-in-out infinite;
    transform-origin: 20% 20%;
  }

  /* Happy hop */
  .char.hopping .bear-root {
    animation: happyHop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  /* Extra blush intensify */
  .char .blush-circle { transition: opacity 0.6s, transform 0.6s; }
  .char.extra-blush .blush-circle {
    opacity: 1 !important;
    transform: scale(1.25);
  }

  /* Walk-in from offstage */
  .char.from-left { left: -25% !important; transition: none; }
  .char.from-right { left: 110% !important; transition: none; }

  .held-slot {
    position: absolute;
    top: 42%;
    right: 2%;
    width: 28px; height: 28px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .char.holding .held-slot { opacity: 1; }
  .held-slot svg, .held-slot .emoji-held {
    width: 100%; height: 100%;
    display: block;
  }
  .held-slot .emoji-held {
    font-size: 22px;
    line-height: 28px;
    text-align: center;
    transform: rotate(12deg);
  }
  .held-slot.baby-held .emoji-held { font-size: 0; }

  .bubble {
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 2px solid var(--outline);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 0.7rem;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 25;
    pointer-events: none;
    color: var(--ink);
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--outline);
  }
  .bubble.show { opacity: 1; }
  .stage.bedroom .bubble {
    background: #3a2850;
    color: #ffe8f0;
    border-color: #c080b0;
  }
  .stage.bedroom .bubble::after { border-top-color: #c080b0; }

  /* ---- Lani ---- */
  .lani {
    position: absolute;
    bottom: 12%;
    width: 52px;
    height: 42px;
    z-index: 8;
    transition: left 2.8s ease, bottom 1s ease;
  }
  .lani svg { width: 100%; height: 100%; overflow: visible; }
  .lani .tail {
    transform-origin: 8px 28px;
    animation: tailFlick 2.2s ease-in-out infinite;
  }
  .lani.walking .lani-root {
    animation: catWalk 0.5s ease-in-out infinite;
  }
  .lani.walking .paw-l { animation: catPawL 0.5s ease-in-out infinite; transform-origin: center top; }
  .lani.walking .paw-r { animation: catPawR 0.5s ease-in-out infinite; transform-origin: center top; }

  /* ---- Baby (mini bear) ---- */
  .baby {
    position: absolute;
    bottom: 34%;
    left: 50%;
    width: 56px;
    height: 68px;
    margin-left: -28px;
    z-index: 16;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s, bottom 0.6s;
    pointer-events: none;
  }
  .baby.show {
    transform: scale(1);
    opacity: 1;
    animation: babyBounceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .baby.focus {
    transform: scale(1.45);
    bottom: 40%;
    z-index: 28;
  }
  .baby svg { width: 100%; height: 100%; overflow: visible; }
  .baby-label {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    color: #ffe8f0;
    background: rgba(80, 50, 100, 0.85);
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .baby.show .baby-label { opacity: 1; }
  .focus-ring {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    border: 2px solid rgba(255, 200, 220, 0.5);
    box-shadow: 0 0 24px rgba(255, 180, 200, 0.4);
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  .baby.focus .focus-ring { opacity: 1; animation: softPulse 2s ease-in-out infinite; }

  /* Controls */
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .who-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .who-label { font-size: 0.8rem; color: var(--soft); font-weight: 600; }
  .toggle {
    display: flex;
    background: #fff;
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 2px solid #f0d8e0;
  }
  .toggle button {
    border: none;
    background: transparent;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--soft);
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle button.active {
    background: linear-gradient(135deg, #f8a0b8, #e87098);
    color: #fff;
    box-shadow: 0 2px 6px rgba(232, 112, 152, 0.4);
  }
  .toggle button.active.dudu-active {
    background: linear-gradient(135deg, #d4a878, #c69c7c);
    box-shadow: 0 2px 6px rgba(198, 156, 124, 0.45);
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .actions button, .story-row button {
    border: none;
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .actions button:active, .story-row button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.08);
  }
  .actions button:disabled, .story-row button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .btn-coffee { background: linear-gradient(160deg, #ffe0b8, #f0c090); }
  .btn-adventure { background: linear-gradient(160deg, #c8e8f8, #98d0e8); }
  .btn-bedroom { background: linear-gradient(160deg, #e8d0f0, #d0b0e0); }
  .story-row { display: flex; gap: 8px; }
  .btn-story {
    flex: 1;
    background: linear-gradient(160deg, #ffe8f0, #f0d8ff);
    border: 2px solid #e8b0c8 !important;
  }
  .btn-done {
    display: none;
    flex: 1;
    background: linear-gradient(160deg, #d8f0e0, #b8e8c8);
  }
  .btn-done.show { display: block; }


  .mute-row {
    display: flex;
    justify-content: center;
    margin-top: 2px;
  }
  .btn-mute {
    border: 2px solid #f0d8e0;
    background: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--soft);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    transition: background 0.2s, color 0.2s;
  }
  .btn-mute:hover { background: #fff5f8; }
  .btn-mute.is-muted {
    background: #f0e8e4;
    color: #a08878;
    border-color: #e0d0c8;
  }

  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: var(--soft);
    min-height: 1.2em;
  }
  .progress {
    height: 4px;
    background: rgba(0,0,0,0.06);
    border-radius: 4px;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .progress.show { opacity: 1; }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f8a0b8, #90c0e8);
    border-radius: 4px;
    transition: width 0.1s linear;
  }
  .dedicate {
    text-align: center;
    font-size: 0.72rem;
    color: #c08098;
    padding-top: 4px;
  }

  /* Keyframes */
  @keyframes idleBob {

    50% { transform: rotate(1.5deg); }
  }
  @keyframes nibbleHead {

    50% { transform: rotate(-4deg) translateY(2px); }
  }
  @keyframes sipArm {
    0%, 100% { transform: rotate(0); }
    40% { transform: rotate(-35deg) translateY(-4px); }
    60% { transform: rotate(-35deg) translateY(-4px); }
  }
  @keyframes happyHop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    30% { transform: translateY(-14px) scale(0.96, 1.04); }
    50% { transform: translateY(-4px) scale(1.04, 0.96); }
  }
  @keyframes steamRise {
    0% { opacity: 0; transform: translateY(8px) scale(0.6); }
    30% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-22px) scale(1.1); }
  }
  @keyframes croNibble {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(8deg) scale(0.92); }
  }
  @keyframes crumbFall {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }

  }
  @keyframes sparklePop {
    0% { opacity: 0; transform: scale(0); }
    40% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0; transform: scale(0.5) translateY(-16px); }
  }
  @keyframes mapFlutter {
    0%, 100% { transform: rotate(6deg); }
    50% { transform: rotate(12deg) translateY(-3px); }

  @keyframes pinBounce {

  @keyframes suitcaseBounce {

  @keyframes cloudDrift {

  @keyframes heartRise {

<script>
(function () {
  "use strict";

  var controller = "bubu";
  var mode = "interactive";
  var busy = false;
  var storyTimers = [];
  var laniTimer = null;
  var heartTimers = [];
  var blinkTimer = null;
  var crumbTimer = null;

  var stage = document.getElementById("stage");
  var decor = document.getElementById("decor");
  var sceneTitle = document.getElementById("sceneTitle");
  var dim = document.getElementById("dim");
  var bubu = document.getElementById("bubu");
  var dudu = document.getElementById("dudu");
  var lani = document.getElementById("lani");
  var baby = document.getElementById("baby");
  var bubuBubble = document.getElementById("bubuBubble");
  var duduBubble = document.getElementById("duduBubble");
  var bubuHeld = document.getElementById("bubuHeld");
  var duduHeld = document.getElementById("duduHeld");
  var handsBridge = document.getElementById("handsBridge");
  var heartBurst = document.getElementById("heartBurst");
  var hint = document.getElementById("hint");
  var progress = document.getElementById("progress");
  var progressBar = document.getElementById("progressBar");
  var btnBubu = document.getElementById("btnBubu");
  var btnDudu = document.getElementById("btnDudu");
  var btnCoffee = document.getElementById("btnCoffee");
  var btnAdventure = document.getElementById("btnAdventure");
  var btnBedroom = document.getElementById("btnBedroom");
  var btnStory = document.getElementById("btnStory");
  var btnDone = document.getElementById("btnDone");


  var btnMute = document.getElementById("btnMute");

  /* ---- Soft Web Audio SFX (no external files) ---- */
  var SFX = (function () {
    var ctx = null;
    var master = null;
    var muted = false;
    try { muted = localStorage.getItem("bubuDuduMuted") === "1"; } catch (e) {}
    var cafeGain = null;
    var cafeNoise = null;
    var cafeFilter = null;
    var sceneTimers = [];
    var footTimer = null;
    var suitcaseTimer = null;

    function ensure() {
      if (ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.42;
      master.connect(ctx.destination);
      return ctx;
    }

    function unlock() {
      if (!ensure()) return;
      if (ctx.state === "suspended") {
        ctx.resume().catch(function () {});
      }
    }

    function now() {
      return ctx ? ctx.currentTime : 0;
    }

    function envGain(vol, attack, hold, release, t0) {
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + attack);
      g.gain.setValueAtTime(Math.max(0.0002, vol), t0 + attack + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + hold + release);
      g.connect(master);
      return g;
    }

    function tone(freq, dur, type, vol, when, slideTo) {
      if (!ensure() || muted) return;
      var t0 = (when != null ? when : 0) + now();
      var o = ctx.createOscillator();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo != null) {
        o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      }
      var g = envGain(vol || 0.08, 0.012, Math.max(0.01, dur * 0.35), Math.max(0.04, dur * 0.55), t0);
      o.connect(g);
      o.start(t0);
      o.stop(t0 + dur + 0.08);
    }

    function noiseBurst(dur, vol, hp, lp, when) {
      if (!ensure() || muted) return;
      var t0 = (when != null ? when : 0) + now();
      var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = lp || 1200;
      filter.Q.value = 0.8;
      if (hp) {
        var hpf = ctx.createBiquadFilter();
        hpf.type = "highpass";
        hpf.frequency.value = hp;
        src.connect(hpf);
        hpf.connect(filter);
      } else {
        src.connect(filter);
      }
      var g = envGain(vol || 0.04, 0.005, dur * 0.2, dur * 0.7, t0);
      filter.connect(g);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    }

    function clearSceneTimers() {
      sceneTimers.forEach(function (t) {
        clearTimeout(t);
        clearInterval(t);
      });
      sceneTimers = [];
      if (footTimer) { clearInterval(footTimer); footTimer = null; }
      if (suitcaseTimer) { clearInterval(suitcaseTimer); suitcaseTimer = null; }
    }

    function stopCafe() {
      if (cafeNoise) {
        try { cafeNoise.stop(); } catch (e) {}
        cafeNoise = null;
      }
      cafeGain = null;
      cafeFilter = null;
    }

    function stopAllLoops() {
      clearSceneTimers();
      stopCafe();
    }

    function setMuted(v) {
      muted = !!v;
      try { localStorage.setItem("bubuDuduMuted", muted ? "1" : "0"); } catch (e) {}
      if (ensure() && master) {
        master.gain.setTargetAtTime(muted ? 0 : 0.42, now(), 0.03);
      }
      if (muted) stopAllLoops();
      return muted;
    }

    function isMuted() { return muted; }

    /* ---- Cue library ---- */
    function uiSelect() {
      unlock();
      tone(520, 0.07, "sine", 0.05);
      tone(780, 0.09, "triangle", 0.035, 0.04);
    }

    function uiTap() {
      unlock();
      tone(440, 0.05, "triangle", 0.045);
      tone(660, 0.08, "sine", 0.03, 0.03);
    }

    function storyStart() {
      unlock();
      tone(392, 0.12, "sine", 0.055);
      tone(494, 0.12, "sine", 0.05, 0.1);
      tone(587, 0.18, "triangle", 0.055, 0.2);
      tone(784, 0.22, "sine", 0.04, 0.32);
    }

    function storyEnd() {
      unlock();
      tone(659, 0.14, "sine", 0.05);
      tone(523, 0.16, "triangle", 0.045, 0.12);
      tone(392, 0.28, "sine", 0.055, 0.26);
    }

    function sceneChime() {
      unlock();
      tone(698, 0.1, "sine", 0.04);
      tone(880, 0.14, "triangle", 0.035, 0.08);
    }

    function cupClink() {
      tone(1400, 0.06, "sine", 0.04);
      tone(2100, 0.1, "triangle", 0.025, 0.02);
      noiseBurst(0.04, 0.02, 2000, 4000);
    }

    function nibble() {
      noiseBurst(0.05, 0.028, 800, 2200);
      tone(180, 0.04, "triangle", 0.02);
    }

    function sip() {
      noiseBurst(0.12, 0.018, 400, 900);
      tone(220, 0.1, "sine", 0.015, 0, 160);
    }

    function startCafe() {
      unlock();
      stopCafe();
      if (!ensure() || muted) return;
      // Very quiet filtered noise as soft cafe hush
      var len = Math.floor(ctx.sampleRate * 2);

  }

  function runStory() {
    if (busy) return;
    clearTimers();
    mode = "story";
    setBusy(true);
    btnDone.classList.remove("show");
    progress.classList.add("show");
    setProgress(0);
    hint.textContent = "Story playing...";
    SFX.storyStart();
    SFX.sceneChime();

    var total = 35000;
    var start = Date.now();
    var tick = setInterval(function () {
      var elapsed = Date.now() - start;
      setProgress((elapsed / total) * 100);
      if (elapsed >= total) clearInterval(tick);
    }, 100);
    storyTimers.push(tick);

    runCoffee({ who: "bubu", titleMs: 3000 });
    hint.textContent = "Scene 1: Coffee date";

    var s2 = setTimeout(function () {
      SFX.sceneChime();
      runAdventure({ who: "dudu", titleMs: 3000 });
      hint.textContent = "Scene 2: Little adventure";
    }, 10000);
    storyTimers.push(s2);

    var s3 = setTimeout(function () {
      SFX.sceneChime();
      runBedroom({
        who: "bubu",
        titleMs: 3000,
        babyDelay: 5000,
        focusDelay: 10000
      });
      hint.textContent = "Scene 3: Cozy time, then baby boy Nikola";
    }, 20000);
    storyTimers.push(s3);

    var done = setTimeout(function () {
      clearInterval(tick);
      setProgress(100);
      mode = "interactive";
      setBusy(false);
      progress.classList.remove("show");
      btnDone.classList.add("show");
      hint.textContent = "Story done. Tap Done / Replay, or try activities yourself.";
      showTitle("The end", 4000);
      SFX.stopAllLoops();
      SFX.storyEnd();
    }, 35000);
    storyTimers.push(done);
  }

  function onDone() {
    clearTimers();
    mode = "interactive";
    setBusy(false);
    progress.classList.remove("show");
    btnDone.classList.remove("show");
    setProgress(0);
    idleHome();
  }

  btnBubu.addEventListener("click", function () { setController("bubu"); });
  btnDudu.addEventListener("click", function () { setController("dudu"); });
  btnCoffee.addEventListener("click", function () {
    if (busy && mode === "story") return;
    SFX.uiTap();
    clearTimers();
    runCoffee();
  });
  btnAdventure.addEventListener("click", function () {
    if (busy && mode === "story") return;
    SFX.uiTap();
    clearTimers();
    runAdventure();
  });
  btnBedroom.addEventListener("click", function () {
    if (busy && mode === "story") return;
    SFX.uiTap();
    clearTimers();
    runBedroom({ babyDelay: 3500, focusDelay: 7000 });
  });
  btnStory.addEventListener("click", runStory);
  btnDone.addEventListener("click", function () {
    SFX.uiTap();
    onDone();
  });

  function syncMuteButton() {
    var m = SFX.isMuted();
    btnMute.textContent = m ? "Sound off" : "Sound on";
    btnMute.classList.toggle("is-muted", m);
    btnMute.setAttribute("aria-pressed", m ? "true" : "false");
  }
  btnMute.addEventListener("click", function () {
    SFX.unlock();
    SFX.setMuted(!SFX.isMuted());
    syncMuteButton();
  });
  syncMuteButton();

  // Resume AudioContext on first user gesture (browser autoplay policy)
  function unlockAudioOnce() {
    SFX.unlock();
    document.removeEventListener("pointerdown", unlockAudioOnce);
    document.removeEventListener("touchstart", unlockAudioOnce);
    document.removeEventListener("keydown", unlockAudioOnce);
  }
  document.addEventListener("pointerdown", unlockAudioOnce);
  document.addEventListener("touchstart", unlockAudioOnce, { passive: true });
  document.addEventListener("keydown", unlockAudioOnce);

  setController("bubu");
  idleHome();
  wanderLani();
  startBlinkLoop();
})();
</script>
</body>
</html>
